syntax = "proto3";

package customer.v1;

import "buf/validate/validate.proto";
import "contact/v1/contact.proto";

option go_package = "github.com/0utl1er-tech/phox-customer/gen/pb/customer/v1;customerv1";

message CreateCustomerRequest {
  string book_id = 1 [(buf.validate.field).string.uuid = true];
  string phone = 2 [(buf.validate.field).string.max_len = 64];
  string category = 3 [(buf.validate.field).string.max_len = 128];
  string name = 4 [(buf.validate.field).string.max_len = 128];
  string corporation = 5 [(buf.validate.field).string.max_len = 128];
  string address = 6 [(buf.validate.field).string.max_len = 128];
  string memo = 7 [(buf.validate.field).string.max_len = 1024];
  string mail = 8 [(buf.validate.field).string.max_len = 256];
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message ListCustomerRequest {
  string book_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2;
  int32 offset = 3;
}

message ListCustomerResponse {
  repeated Customer customers = 1;
  // Book 内の総件数 (ページネーション用)。
  int64 total_count = 2;
}

message GetCustomerRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetCustomerResponse {
  Customer customer = 1;
}

message Customer {
  string id = 1;
  string book_id = 2;
  string phone = 3;
  string category = 4;
  string name = 5;
  string corporation = 6;
  string address = 7;
  string memo = 8;
  repeated contact.v1.Contact contacts = 9;
  // フィールド番号 10 は廃止された `calls` (旧 CallService 依存) 用。
  // Phase 12 で Activity に移行済。再利用は禁止 (後方互換のため reserved)。
  reserved 10;
  reserved "calls";
  string mail = 11;
}

message UpdateCustomerRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string phone = 2 [(buf.validate.field).string.max_len = 64];
  optional string category = 3 [(buf.validate.field).string.max_len = 128];
  optional string name = 4 [(buf.validate.field).string.max_len = 128];
  optional string corporation = 5 [(buf.validate.field).string.max_len = 128];
  optional string address = 6 [(buf.validate.field).string.max_len = 128];
  optional string memo = 7 [(buf.validate.field).string.max_len = 1024];
  optional string mail = 8 [(buf.validate.field).string.max_len = 256];
}

message UpdateCustomerResponse {
  Customer updated_customer = 1;
}

message DeleteCustomerRequest {
  string customer_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteCustomerResponse {
  string customer_id = 1;
}

// ---------------------------------------------------------------------------
// Phase 27j: Gemini による CSV 取り込みデータ補完
//
// CSV インポートのプレビュー段階で、雑な営業リスト (列名バラバラ・法人格の
// 表記ゆれ・電話番号/メールの書式不統一など) を LLM で正規化した結果を
// 「提案」として返す。元データは一切変更せず、UI 側でユーザーが確認して
// 適用した行だけが通常の ImportBook に渡る。
// ---------------------------------------------------------------------------

// CSV の 1 行分の生データ (cells は headers と同じ並び)。
message CustomerRowValues {
  repeated string cells = 1 [(buf.validate.field).repeated.max_items = 64];
}

message EnrichCustomerRowsRequest {
  // CSV の列ヘッダ (任意の表記。日本語ヘッダも可)。
  repeated string headers = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64
  ];
  // 生の行データ。1 リクエスト最大 500 行 (超える場合はクライアントが分割)。
  repeated CustomerRowValues rows = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 500
  ];
  // 補完対象フィールド。空なら全フィールド対象。
  // canonical 名: phone / category / name / corporation / address / memo / mail
  repeated string target_fields = 3 [(buf.validate.field).repeated.max_items = 16];
}

// 1 行分の補完結果。fields は canonical フィールド名 →正規化済み値。
message EnrichedCustomerRow {
  // リクエストの rows における添字 (0-based)。
  int32 row_index = 1;
  // canonical フィールド名 (phone/category/name/corporation/address/memo/mail)
  // → 正規化・補完後の値。根拠が無いフィールドは空文字。
  map<string, string> fields = 2;
  // モデルの自己申告 confidence (0.0-1.0)。
  double confidence = 3;
  // 元データ (ヘッダの canonical マッピング後) から 1 つでも値が変わったか。
  bool changed = 4;
}

message EnrichCustomerRowsResponse {
  repeated EnrichedCustomerRow rows = 1;
  // 実際に使用したモデル名 (例: gemini-2.0-flash)。
  string model = 2;
}

message GetEnrichmentStatusRequest {}

message GetEnrichmentStatusResponse {
  // GEMINI_API_KEY が設定されていて AI 補完が利用できるか。
  bool enabled = 1;
  // 使用するモデル名 (enabled=false のときは空)。
  string model = 2;
}
