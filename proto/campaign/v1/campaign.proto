syntax = "proto3";

package campaign.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/0utl1er-tech/phox-customer/gen/pb/campaign/v1;campaignv1";

// CampaignService — コールドメール一斉送信 (Phase 27)。
// Campaign は会社スコープの「受信者スナップショット + 本文テンプレート +
// ペーシング設定 + 送信 Mailbox プール」。
//
// RBAC: 作成/開始/停止/閲覧はプール内全 Mailbox への editor 以上の
// MailboxPermit、作成時は受信者が属する全 Book への editor 以上の Permit。
service CampaignService {
  // 受信者スナップショットごと作成 (draft)。メール無し/重複/サプレッション済み
  // は skipped として記録され、内訳がレスポンスで返る。
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse);
  rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse);
  rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse);
  // draft / paused のみ。
  rpc UpdateCampaign(UpdateCampaignRequest) returns (UpdateCampaignResponse);
  // 特電法フィールド (sender_org/address/contact) の非空を検証してから running へ。
  rpc StartCampaign(StartCampaignRequest) returns (StartCampaignResponse);
  // running <-> paused のトグル。
  rpc PauseCampaign(PauseCampaignRequest) returns (PauseCampaignResponse);
  rpc CancelCampaign(CancelCampaignRequest) returns (CancelCampaignResponse);
  // draft / cancelled のみ削除可。
  rpc DeleteCampaign(DeleteCampaignRequest) returns (DeleteCampaignResponse);
  rpc ListCampaignRecipients(ListCampaignRecipientsRequest) returns (ListCampaignRecipientsResponse);
  // 受信者毎のイベント履歴 (open/click/unsubscribe/reply/bounce)。ドリルダウン用。
  rpc ListRecipientEvents(ListRecipientEventsRequest) returns (ListRecipientEventsResponse);
  // 日次時系列 (送信/開封/クリック/返信/バウンス/配停)。折れ線グラフ用。
  rpc GetCampaignTimeseries(GetCampaignTimeseriesRequest) returns (GetCampaignTimeseriesResponse);
  // failed の受信者を queued に戻す (明示操作のみ — 自動再送はしない)。
  rpc RequeueFailedRecipients(RequeueFailedRecipientsRequest) returns (RequeueFailedRecipientsResponse);
  // レンダリング済み本文 (フッター込み) を指定アドレスへテスト送信。
  rpc SendTestEmail(SendTestEmailRequest) returns (SendTestEmailResponse);

  // 送信元メールボックスの健全性 (Phase 27f)。SPF/DKIM/DMARC/MX の DNS 点検 +
  // 直近のバウンス率・配信停止率。DNS を実引きするので数秒かかることがある。
  rpc CheckMailboxHealth(CheckMailboxHealthRequest) returns (CheckMailboxHealthResponse);

  // 呼び出しユーザーが MailboxPermit を持つ全メールボックスの送信実績サマリを
  // 1 コールで返す (Phase 27g)。DB 集計のみで DNS は引かない (軽い) —
  // DNS 点検は CheckMailboxHealth をオンデマンドで呼ぶこと。
  rpc ListMailboxesHealth(ListMailboxesHealthRequest) returns (ListMailboxesHealthResponse);

  // サプレッションリスト (会社単位の配信停止/バウンス/手動除外)。
  rpc ListSuppressions(ListSuppressionsRequest) returns (ListSuppressionsResponse);
  rpc AddSuppression(AddSuppressionRequest) returns (AddSuppressionResponse);
  // reason=manual の行のみ削除可 (unsubscribe/hard_bounce は法令/運用上残す)。
  rpc RemoveSuppression(RemoveSuppressionRequest) returns (RemoveSuppressionResponse);
}

// ペーシング設定。worker は Asia/Tokyo で解釈する。
message CampaignSchedule {
  int32 send_start_hour = 1 [(buf.validate.field).int32 = {gte: 0, lte: 23}];
  int32 send_end_hour = 2 [(buf.validate.field).int32 = {gte: 1, lte: 24}];
  // bitmask Mon=1, Tue=2, Wed=4, Thu=8, Fri=16, Sat=32, Sun=64。0 は平日扱い。
  int32 send_days = 3 [(buf.validate.field).int32 = {gte: 0, lte: 127}];
  int32 daily_cap_per_mailbox = 4 [(buf.validate.field).int32 = {gte: 1, lte: 1000}];
  int32 min_interval_sec = 5 [(buf.validate.field).int32 = {gte: 10, lte: 3600}];
  bool warmup_enabled = 6;
  // Phase 27f: ハードバウンス率 (%) の自動停止しきい値。0 で無効、既定 5。
  int32 bounce_pause_threshold = 7 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
}

// フォローアップ (Phase 27e): 前ステップ送信後、返信が無ければ wait_days 日後に
// 送る追いメール。同一スレッドへの返信として送られる (In-Reply-To/References)。
message CampaignFollowup {
  int32 step_no = 1; // 2.. (1 通目は Campaign.subject/body)。Create/Update では無視され自動採番
  int32 wait_days = 2 [(buf.validate.field).int32 = {gte: 1, lte: 60}];
  // 空なら "Re: <1通目の件名>" (スレッド返信の体裁)。
  string subject = 3;
  string body = 4 [(buf.validate.field).string.min_len = 1];
}

// 特定電子メール法の送信者表示。全メールのフッターに自動挿入される。
message CampaignSender {
  string sender_org = 1;     // 会社名/氏名
  string sender_address = 2; // 住所
  string sender_contact = 3; // 電話 or 問い合わせ先
}

message CampaignStats {
  int32 total = 1;
  int32 queued = 2; // queued + sending
  int32 sent = 3;
  int32 failed = 4;
  int32 skipped = 5;
  int32 opened = 6;
  int32 clicked = 7;
  int32 replied = 8;
  int32 bounced = 9;
  int32 unsubscribed = 10;
  // 最後に送信した時刻 (「今動いている」表示用)。
  optional google.protobuf.Timestamp last_sent_at = 11;
  // フォローアップ待ち (1 通以上送信済みで次ステップの時期待ち)。
  int32 waiting_followup = 12;
}

message Campaign {
  string id = 1;
  string name = 2;
  string status = 3; // draft|running|paused|completed|cancelled
  string subject = 4;
  string body = 5;
  bool track_opens = 6;
  bool track_clicks = 7;
  CampaignSchedule schedule = 8;
  CampaignSender sender = 9;
  repeated string mailbox_ids = 10;
  CampaignStats stats = 11;
  string created_by = 12;
  optional google.protobuf.Timestamp started_at = 13;
  optional google.protobuf.Timestamp completed_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // running 中のみ: ペーシング設定と残数から算出した完了予定時刻 (JST 送信窓・
  // 曜日・日次上限・warmup を考慮したシミュレーション値、目安)。
  optional google.protobuf.Timestamp estimated_completion_at = 17;
  // フォローアップステップ (2 通目以降)。空 = 単発キャンペーン。
  repeated CampaignFollowup followups = 18;
  // Phase 27f: ハードバウンス率 (%) がこれを超えると自動一時停止。0 で無効。
  int32 bounce_pause_threshold = 19;
  // 自動一時停止された理由 (空 = 自動停止されていない)。paused 表示に添える。
  string health_paused_reason = 20;
}

message CreateCampaignRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated string customer_ids = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 10000}];
  repeated string mailbox_ids = 3 [(buf.validate.field).repeated.min_items = 1];
  string subject = 4;
  string body = 5;
  CampaignSchedule schedule = 6;
  CampaignSender sender = 7;
  bool track_opens = 8;
  bool track_clicks = 9;
  // フォローアップ (2 通目以降)。最大 5 ステップ。
  repeated CampaignFollowup followups = 10 [(buf.validate.field).repeated.max_items = 5];
}
message CreateCampaignResponse {
  Campaign campaign = 1;
  // スナップショット時の内訳 (UI が「1,240 選択 → 1,180 queued (60 skipped)」を出す)。
  int32 queued_count = 2;
  int32 skipped_no_email = 3;
  int32 skipped_suppressed = 4;
  int32 skipped_duplicate = 5;
  // Phase 27f: MX レコードが無く配信不能と判定して除外した件数。
  int32 skipped_no_mx = 6;
  // 送信対象に含まれる role アドレス (info@ 等) の件数。除外はしないが、
  // 苦情率が上がりやすいので UI で注意喚起する。
  int32 role_address_count = 7;
}

// 送信元メールボックスの健全性 (Phase 27f)。
message MailboxHealth {
  string mailbox_id = 1;
  string address = 2;
  string domain = 3;

  // DNS 点検
  bool has_mx = 4;
  string mx_host = 5;
  bool has_spf = 6;
  string spf = 7;
  bool has_dmarc = 8;
  string dmarc = 9;
  string dmarc_policy = 10; // none|quarantine|reject
  bool has_dkim = 11;
  string dkim_selector = 12;

  // 直近 30 日の送信実績 (全キャンペーン横断)
  int32 sent = 13;
  int32 bounced = 14;
  int32 unsubscribed = 15;
  int32 replied = 16;
  double bounce_rate = 17;       // %
  double unsubscribe_rate = 18;  // %

  // 総合判定: good | warn | bad
  string grade = 19;
  // 人が読める指摘 (DNS 設定の不備・バウンス率の高さなど)。
  repeated string warnings = 20;
}

message CheckMailboxHealthRequest {
  string mailbox_id = 1 [(buf.validate.field).string.uuid = true];
  // DKIM の selector。空なら mailu 既定の "dkim" を使う。
  string dkim_selector = 2;
}
message CheckMailboxHealthResponse {
  MailboxHealth health = 1;
}

// メールボックス毎の送信実績サマリ (Phase 27g)。DB 集計のみ (DNS 点検なし)。
// 30 日系の率 (%) は sent_30d を分母に、その送信分に付いたイベントで計算する。
message MailboxHealthStats {
  string mailbox_id = 1;
  string address = 2;

  // 本日 (JST 0 時起算) の送信数。全キャンペーン横断 — daily cap と同じ起算。
  int32 sent_today = 3;
  optional google.protobuf.Timestamp last_sent_at = 4;

  // 直近 30 日 (全キャンペーン横断)
  int32 sent_30d = 5;
  int32 bounced_30d = 6;
  int32 unsubscribed_30d = 7;
  int32 replied_30d = 8;
  int32 opened_30d = 9;
  double bounce_rate = 10;      // %
  double unsubscribe_rate = 11; // %
  double reply_rate = 12;       // %
  double open_rate = 13;        // %

  // このメールボックスをプールに含む running キャンペーン数。
  int32 running_campaigns = 14;
  // IMAP 取り込みの最終成功時刻 (未同期なら無し)。
  optional google.protobuf.Timestamp imap_synced_at = 15;

  // 実績のみの簡易判定: good | warn | bad。
  // バウンス率 >5% で bad、>2% または配停率 >3% で warn (サンプル 20 通未満は good)。
  // DNS 込みの総合判定は CheckMailboxHealth の grade を使うこと。
  string grade = 16;
}

message ListMailboxesHealthRequest {}
message ListMailboxesHealthResponse {
  repeated MailboxHealthStats stats = 1;
}

message ListCampaignsRequest {
  optional int32 limit = 1 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
  optional int32 offset = 2 [(buf.validate.field).int32.gte = 0];
}
message ListCampaignsResponse {
  repeated Campaign campaigns = 1;
  int64 total = 2;
}

message GetCampaignRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetCampaignResponse {
  Campaign campaign = 1;
}

message UpdateCampaignRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2;
  optional string subject = 3;
  optional string body = 4;
  optional bool track_opens = 5;
  optional bool track_clicks = 6;
  CampaignSchedule schedule = 7;   // 未指定なら変更しない
  CampaignSender sender = 8;       // 未指定なら変更しない
  repeated string mailbox_ids = 9; // 空なら変更しない
  // 空なら変更しない。変更する場合は全ステップを送る (全置換)。
  repeated CampaignFollowup followups = 10 [(buf.validate.field).repeated.max_items = 5];
}
message UpdateCampaignResponse {
  Campaign campaign = 1;
}

message StartCampaignRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message StartCampaignResponse {
  Campaign campaign = 1;
}

message PauseCampaignRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message PauseCampaignResponse {
  Campaign campaign = 1;
}

message CancelCampaignRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message CancelCampaignResponse {
  Campaign campaign = 1;
}

message DeleteCampaignRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteCampaignResponse {
  string id = 1;
}

message CampaignRecipient {
  string id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string customer_corporation = 4;
  string email = 5;
  string status = 6; // queued|sending|sent|failed|skipped
  string error = 7;
  optional google.protobuf.Timestamp sent_at = 8;
  optional google.protobuf.Timestamp first_opened_at = 9;
  optional google.protobuf.Timestamp first_clicked_at = 10;
  optional google.protobuf.Timestamp replied_at = 11;
  optional google.protobuf.Timestamp bounced_at = 12;
  optional google.protobuf.Timestamp unsubscribed_at = 13;
  // 現在のステップ (1 = 1 通目)。
  int32 current_step = 14;
  // 次のフォローアップ送信予定 (待機中のみ)。
  optional google.protobuf.Timestamp next_step_at = 15;
}

message ListCampaignRecipientsRequest {
  string campaign_id = 1 [(buf.validate.field).string.uuid = true];
  // queued|sending|sent|failed|skipped。未指定なら全部。
  optional string status = 2;
  optional int32 limit = 3 [(buf.validate.field).int32 = {gte: 1, lte: 200}];
  optional int32 offset = 4 [(buf.validate.field).int32.gte = 0];
}
message ListCampaignRecipientsResponse {
  repeated CampaignRecipient recipients = 1;
  int64 total = 2;
}

message CampaignDailyStat {
  string date = 1; // "YYYY-MM-DD" (JST)
  int32 sent = 2;
  int32 opened = 3;
  int32 clicked = 4;
  int32 replied = 5;
  int32 bounced = 6;
  int32 unsubscribed = 7;
}

message GetCampaignTimeseriesRequest {
  string campaign_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetCampaignTimeseriesResponse {
  repeated CampaignDailyStat days = 1;
}

message CampaignEvent {
  string id = 1;
  string kind = 2; // open|click|unsubscribe|reply|bounce
  string url = 3;
  string user_agent = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListRecipientEventsRequest {
  string recipient_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListRecipientEventsResponse {
  repeated CampaignEvent events = 1;
}

message RequeueFailedRecipientsRequest {
  string campaign_id = 1 [(buf.validate.field).string.uuid = true];
}
message RequeueFailedRecipientsResponse {
  int64 requeued = 1;
}

message SendTestEmailRequest {
  string campaign_id = 1 [(buf.validate.field).string.uuid = true];
  string to = 2 [(buf.validate.field).string.min_len = 3];
  // プール内のどの mailbox で送るか。
  string mailbox_id = 3 [(buf.validate.field).string.uuid = true];
}
message SendTestEmailResponse {}

message Suppression {
  string id = 1;
  string email = 2;
  string reason = 3; // unsubscribe|hard_bounce|manual|complaint
  optional string campaign_id = 4;
  string note = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListSuppressionsRequest {
  optional string search = 1;
  optional int32 limit = 2 [(buf.validate.field).int32 = {gte: 1, lte: 200}];
  optional int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}
message ListSuppressionsResponse {
  repeated Suppression suppressions = 1;
  int64 total = 2;
}

message AddSuppressionRequest {
  string email = 1 [(buf.validate.field).string.min_len = 3];
  string note = 2;
}
message AddSuppressionResponse {
  Suppression suppression = 1;
}

message RemoveSuppressionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message RemoveSuppressionResponse {
  string id = 1;
}
